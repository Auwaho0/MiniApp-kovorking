services:
  - type: web
    name: coworking-api
    runtime: docker
    plan: free
    region: frankfurt  # или oregon, синхронизируй с базой
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"